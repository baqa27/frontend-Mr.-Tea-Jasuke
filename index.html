<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F4FBF8" />
    <meta name="description" content="Pencatatan penjualan, stok, dan serah terima shift Mr. Tea & Jasuke" />
    <title>Mr. Tea & Jasuke</title>
    <script>
      ;(function () {
        var tema = "sistem"
        try {
          var tersimpan = localStorage.getItem("mrtea-tema")
          if (tersimpan) {
            var parsed = JSON.parse(tersimpan)
            if (parsed && parsed.state && parsed.state.pilihan) {
              tema = parsed.state.pilihan
            }
          }
        } catch (e) {}
        var gelap = tema === "gelap" || (tema === "sistem" && window.matchMedia("(prefers-color-scheme: dark)").matches)
        document.documentElement.classList.toggle("dark", gelap)
        document.documentElement.style.colorScheme = gelap ? "dark" : "light"
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute("content", gelap ? "#141a17" : "#F4FBF8")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
